<html><head><style>
:root { --bg: #ffffff; --fg: #1f2328; --overlay: #ffffffe6; --border: #d1d9e0b3; --accent: hsl(212, 92%, 43%); }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #f0f6fc; } .themed { background-color: #010409; } }
@media (pointer: coarse) { .touchonly { background-color: #ff0000; } }
@media (unknown-feature) { .weird { background-color: #00ff00; } }
body { background: var(--bg); color: var(--fg); }
.hdr { background-color: var(--overlay); position: sticky; top: 0; }
.btn { background-color: var(--border); }
.acc { background-color: var(--accent); }
.mix { background-color: color-mix(in srgb, #ff0000, #0000ff); }
</style></head>
<body>
<div class="hdr" id="hdr">HEADER sticky</div>
<div class="themed" id="themed">THEMED dark-only bg</div>
<div class="btn" id="btn">BTN 8digit</div>
<div class="acc" id="acc">ACC hsl</div>
<div class="mix" id="mix">MIX unsupported</div>
<div class="touchonly" id="touch">TOUCH</div>
<div class="weird" id="weird">WEIRD</div>
<details id="menu"><summary>Menu</summary><div id="menucontent">HIDDEN CONTENT</div></details>
<details open id="openmenu"><summary>Open</summary><div id="opencontent">VISIBLE</div></details>
</body></html>
