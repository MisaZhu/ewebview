<html><head><style>
body{font:16px sans-serif;margin:8px}
input,select,textarea,button{display:block;margin:4px 0}
#log{white-space:pre-wrap;background:#eef;padding:4px;margin-top:8px}
</style></head><body>
<input id="t1" value="field">
<input id="pw" type="password" value="secret">
<textarea id="ta">line</textarea>
<input id="cb" type="checkbox">
<input id="r1" type="radio" name="g" checked>
<input id="r2" type="radio" name="g">
<select id="sel"><option value="a">Alpha</option><option value="b">Beta</option><option value="c">Gamma</option></select>
<input id="rg" type="range" min="0" max="100" value="20">
<button id="btn">Go</button>
<div id="log">-</div>
<script>
var ev=[];
function L(m){ev.push(m);if(ev.length>6)ev.shift();}
['input','change','click'].forEach(function(t){
  document.addEventListener(t,function(e){L(t+':'+(e.target.id||e.target.tagName));},true);
});
setInterval(function(){
  var g=function(id){return document.getElementById(id);};
  document.getElementById('log').textContent=
    't1="'+g('t1').value+'" pw="'+g('pw').value+'" cb='+g('cb').checked+
    ' r2='+g('r2').checked+' sel='+g('sel').value+' rg='+g('rg').value+
    ' sel0='+g('t1').selectionStart+'..'+g('t1').selectionEnd+
    ' act='+(document.activeElement&&document.activeElement.id||'?')+
    ' ev=['+ev.join(' ')+']';
},150);
</script>
</body></html>
