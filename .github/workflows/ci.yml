name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config sdl2 sdl2_gfx sdl2_image sdl2_ttf

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config \
            libsdl2-dev libsdl2-gfx-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Build all targets
        run: make -j2

      - name: Verify build artifacts
        run: |
          test -f build_aarch64/virt/lib/libewebview.a
          test -x build_aarch64/virt/bin/sdlbrowser

  ewokos-build:
    name: build (ewokos)
    runs-on: ubuntu-latest

    steps:
      - name: Check out ewebview
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ewebview

      - name: Check out EwokOS
        uses: actions/checkout@v4
        with:
          repository: MisaZhu/ewokos
          submodules: recursive
          path: ewokos

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Provide EwokOS toolchain names
        run: |
          for tool in gcc g++ c++ ar as ld objdump; do
            source_tool="$tool"
            if [ "$tool" = c++ ]; then source_tool=g++; fi
            sudo ln -sf "$(command -v aarch64-linux-gnu-$source_tool)" "/usr/local/bin/aarch64-none-elf-$tool"
          done

      - name: Build EwokOS port
        working-directory: ewebview
        run: |
          make clean
          make -j2 \
            OS_TYPE=ewokos \
            PORTING=ewokos \
            ewokos="$GITHUB_WORKSPACE/ewokos"

      - name: Verify EwokOS artifacts
        run: |
          test -f ewokos/system/build_aarch64/virt/lib/libewebview.a
          test -f ewokos/system/build_aarch64/virt/lib/liblitehtml.a
          test -f ewokos/system/build_aarch64/virt/lib/libmario_jsn.a
          test -f ewokos/system/build_aarch64/virt/lib/libwebp.a
          test -f ewokos/system/build_aarch64/virt/lib/libtinyhttpsc.a
